<!doctype html><html><head><meta charset="utf-8"><title>Lean Shortcuts</title>
<style>
:root{--bg:#fbfbfa;--fg:#1d1d1f;--muted:#6e6e73;--card:#fff;--line:#e3e3e0;--accent:#2f6fde}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f2f2f7;--muted:#a1a1a6;--card:#2c2c2e;--line:#3a3a3c;--accent:#6ea0ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px -apple-system,system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:16px 24px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center}
input{flex:1;font:20px ui-monospace,Menlo,monospace;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);outline:none}
input:focus{border-color:var(--accent)}#n{color:var(--muted);font-size:18px;white-space:nowrap}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:20px 24px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.s{font-size:30px;line-height:1.2;min-height:36px}.k{font:15px ui-monospace,Menlo,monospace;color:var(--muted);word-break:break-all}
.x{opacity:.3}.t{display:inline-block;margin-top:4px;font-size:11px;padding:1px 6px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}.t.sup{background:#2f6fde22;color:var(--accent)}.t.sub{background:#d9731a22;color:#c0640f}
</style></head><body>
<header><input id="q" placeholder="Search command or symbol…" autofocus spellcheck="false"><span id="n"></span></header>
<main id="g"></main>
<script>
const D=__DATA__,g=document.getElementById('g'),q=document.getElementById('q'),n=document.getElementById('n');
const els=D.map(([k,v,t])=>{const d=document.createElement('div');d.className='c';d.innerHTML='<div class="s"></div><div class="k"></div>';if(t){d.children[0].innerHTML='<span class="x">x</span>';d.children[0].append(v);const b=document.createElement('span');b.className='t '+t;b.textContent=t==='sup'?'superscript':'subscript';d.appendChild(b)}else d.children[0].textContent=v;d.children[1].textContent=k;g.appendChild(d);return [k.toLowerCase(),v,d]});
function f(){const t=q.value.trim().replace(/^\\/,'').toLowerCase();let c=0;for(const [k,v,d] of els){const m=!t||k.slice(1).includes(t)||v.includes(q.value.trim());d.style.display=m?'':'none';c+=m}n.textContent=c+' / '+els.length}
q.addEventListener('input',f);f();
// Chrome --app windows reuse their last saved size, ignoring --window-size. So the first time only,
// size ourselves to 70% x 80% of the screen's free area (clamped to 1000-1400 x 640-1000), centred;
// after that Chrome's own memory keeps whatever size the user picks. No-op in a normal tab.
(()=>{const K='leanShortcutsSized';try{if(localStorage.getItem(K))return;localStorage.setItem(K,'1')}catch(e){return}const s=screen,W=s.availWidth,H=s.availHeight,w=Math.min(W,Math.max(1000,Math.min(1400,W*.7))),h=Math.min(H,Math.max(640,Math.min(1000,H*.8)));try{resizeTo(w,h);moveTo((s.availLeft||0)+(W-w)/2,(s.availTop||0)+(H-h)/2)}catch(e){}})();
</script></body></html>
